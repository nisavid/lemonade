name: Docs And Style
on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:

  app-regression-tests:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-app-regression-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Run app regression tests
        run: node test/app/run-app-regression-tests.cjs

  portable-residency-inventory:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-portable-residency-inventory-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Fetch pinned upstream validation source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 https://github.com/lemonade-sdk/lemonade.git a505bbc702cc1fcd44ef73c44defabc98c36d505
          test "$(git rev-parse --verify 'FETCH_HEAD^{commit}')" = a505bbc702cc1fcd44ef73c44defabc98c36d505
          test "$(git cat-file -t 'a505bbc702cc1fcd44ef73c44defabc98c36d505')" = commit
          test "$(git cat-file -t 'a505bbc702cc1fcd44ef73c44defabc98c36d505:src/cpp/include/lemon/model_types.h')" = blob
          test "$(git rev-parse 'a505bbc702cc1fcd44ef73c44defabc98c36d505:src/cpp/include/lemon/model_types.h')" = 3084d17ec13564c506e09e12433c015bfb0f1ab7
      - name: Validate portable residency inventory
        run: python tools/validate_residency_capability_inventory.py
      - name: Test portable residency inventory validator
        run: python -m unittest discover -s test -p 'test_residency_capability_inventory_*.py'

  markdown-link-check:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install markdown-link-check
        run: npm install -g markdown-link-check
      - name: Check Markdown links
        shell: bash
        run: |
          # To run this manually on Windows, run:
          #   npm install -g markdown-link-check
          #   Get-ChildItem -Recurse -Filter *.md | ForEach-Object { markdown-link-check $_.FullName -c .\.github\workflows\mlc_config.json }
          set -euo pipefail
          find . -type f -name "*.md" -not -path "./node_modules/*" \
            -exec markdown-link-check -c .github/workflows/mlc_config.json {} \;
