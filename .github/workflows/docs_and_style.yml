name: Docs And Style
on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:

  app-regression-tests:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-app-regression-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/app/package-lock.json
      - name: Install app dependencies
        working-directory: src/app
        run: npm ci
      - name: Type-check application (same strictness as the production Webpack build)
        working-directory: src/app
        run: npm run typecheck
      - name: Run app regression tests
        run: node test/app/run-app-regression-tests.cjs

  portable-residency-inventory:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-portable-residency-inventory-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
      - name: Fetch pinned upstream validation source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 https://github.com/lemonade-sdk/lemonade.git a505bbc702cc1fcd44ef73c44defabc98c36d505
          test "$(git rev-parse --verify 'FETCH_HEAD^{commit}')" = a505bbc702cc1fcd44ef73c44defabc98c36d505
          test "$(git cat-file -t 'a505bbc702cc1fcd44ef73c44defabc98c36d505')" = commit
          test "$(git cat-file -t 'a505bbc702cc1fcd44ef73c44defabc98c36d505:src/cpp/include/lemon/model_types.h')" = blob
          test "$(git rev-parse 'a505bbc702cc1fcd44ef73c44defabc98c36d505:src/cpp/include/lemon/model_types.h')" = 3084d17ec13564c506e09e12433c015bfb0f1ab7
      - name: Install portable residency contract dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmbedtls-dev nlohmann-json3-dev
          python -m pip install jsonschema
      - name: Validate portable residency inventory
        run: python tools/validate_residency_capability_inventory.py
      - name: Test portable residency inventory validator
        run: python -m unittest discover -s test -p 'test_residency_capability_inventory_*.py'
      - name: Test generated portable residency contract
        run: python -W error test/residency/contract/test_generated_contract.py
      - name: Check generated portable residency contract
        run: python tools/generate_residency_contract.py --check
      - name: Validate portable residency delivery wiring
        run: python -S test/residency/contract/test_delivery_public_seam.py
      - name: Test portable residency cross-component matrix
        run: python -S test/residency/contract/test_cross_component_matrix_public_seam.py
      - name: Verify portable residency generated outputs are clean
        run: git diff --exit-code

  backend-docs-drift:
    # The backend reference doc (docs/dev/backends-reference.md) is generated from
    # the self-describing backend descriptors. Build lemond, regenerate, and fail
    # if the committed doc is stale — the same guarantee a lint provides.
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-backend-docs-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v5
      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache
      - name: Cache compiler objects
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-backend-drift-${{ hashFiles('CMakeLists.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-backend-drift-${{ hashFiles('CMakeLists.txt') }}-
            ccache-backend-drift-
      - name: Configure and install build dependencies
        run: ./setup.sh
      - name: Build lemond
        run: cmake --build --preset default --target lemond
      - name: Check backend reference docs are up to date
        run: python3 docs/tools/gen_backend_boilerplate.py --check

  model-registry-labels:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-model-labels-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - name: Check every model in server_models.json declares a modality
        run: python3 test/test_server_models_labels.py

  pre-commit:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-pre-commit-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pre-commit openai requests
      - name: Run the comment-slop unit tests
        run: python -m unittest test.test_comment_slop -v
      - name: Run backend benchmark archive tests
        run: python -m unittest test.test_validate_backend_bench -v
      - name: Run server helper cleanup tests
        run: python -m unittest test.test_server_base_cleanup -v

      - name: Run pre-commit on the changed files
        # Scoped to what the change touches; running repo-wide would fail on drift that
        # predates it and is not the contributor's to fix.
        #
        # The base is the branch the change actually targets, so a PR onto a release
        # branch is not diffed against main. In a merge queue HEAD also carries the PRs
        # ahead of this one, so the diff is widened by changes this author never made:
        # the deterministic hooks are fine with that, but the comment-slop heuristic
        # would then compare comments across several independently-approved PRs and fail
        # one of them for the first time in the queue. Keep that decision PR-scoped.
        env:
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || github.event.repository.default_branch }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              BASE=$(git hash-object -t tree /dev/null)
            else
              if [[ ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo "Invalid push base: $BEFORE_SHA" >&2
                exit 1
              fi
              if ! git cat-file -e "$BEFORE_SHA^{commit}"; then
                git fetch --no-tags origin "$BEFORE_SHA"
              fi
              BASE="$BEFORE_SHA"
            fi
          else
            BASE_BRANCH="${BASE_REF#refs/heads/}"
            # checkout already fetched full history (fetch-depth: 0); fetch the base branch
            # so origin/<base> resolves for merge-base. No --depth: 0 is not a valid depth.
            git fetch --no-tags origin "$BASE_BRANCH"
            BASE=$(git merge-base "origin/$BASE_BRANCH" HEAD)
          fi

          if [ "${{ github.event_name }}" = "merge_group" ]; then
            SKIP=comment-slop
          fi
          SKIP="${SKIP:-}" pre-commit run \
            --from-ref "$BASE" \
            --to-ref HEAD \
            --show-diff-on-failure

  markdown-link-check:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install markdown-link-check
        run: npm install -g markdown-link-check
      - name: Check Markdown links
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name "*.md" -not -path "./node_modules/*" -print0 | \
            xargs -0 -P 4 -n 1 markdown-link-check -c .github/workflows/mlc_config.json
