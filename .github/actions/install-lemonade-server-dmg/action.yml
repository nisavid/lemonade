name: 'Install Lemonade Server (.pkg)'
description: 'Downloads and installs Lemonade Server from a .pkg, then verifies installation'
inputs:
  version:
    description: 'Version string for the package (e.g., 9.3.1)'
    required: true
  artifact-name:
    description: 'Name of the artifact to download'
    required: false
    default: 'lemonade-macos-pkg'
  download-artifact:
    description: 'Whether to download the artifact (set to false if already downloaded)'
    required: false
    default: 'true'

outputs:
  bin-path:
    description: 'Path to the installed binaries directory'
    value: ${{ steps.install.outputs.bin-path }}

runs:
  using: "composite"
  steps:
    - name: Download .pkg package
      if: ${{ inputs.download-artifact == 'true' }}
      uses: actions/download-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: .

    - name: Install .pkg
      id: install
      shell: bash
      run: |
        set -euo pipefail

        echo "Looking for .pkg file..."

        PKG_FILE=$(find . -maxdepth 1 -name "*.pkg" -type f | head -1)

        if [ -z "$PKG_FILE" ]; then
            echo "ERROR: No .pkg file found in current directory!"
            ls -la
            exit 1
        fi

        echo "Installing: $PKG_FILE"
        CATALOG_MEMBER="Library/Application Support/Lemonade/resources/residency_profiles.json"
        PKG_PAYLOAD_FILES=$(pkgutil --payload-files "$PKG_FILE")
        CATALOG_MEMBERS=$(printf '%s\n' "$PKG_PAYLOAD_FILES" | grep -E '(^|/)residency_profiles\.json$')
        CATALOG_MEMBER_COUNT=$(printf '%s\n' "$CATALOG_MEMBERS" | wc -l)
        test "$CATALOG_MEMBER_COUNT" -eq 1
        test "$CATALOG_MEMBERS" = "$CATALOG_MEMBER"

        PKG_EXPAND_PATH="$RUNNER_TEMP/lemonade-pkg-expanded-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        test ! -e "$PKG_EXPAND_PATH"
        pkgutil --expand-full "$PKG_FILE" "$PKG_EXPAND_PATH"
        CATALOG_PAYLOAD_FILES=$(find "$PKG_EXPAND_PATH" -type f -path '*/Library/Application Support/Lemonade/resources/residency_profiles.json')
        CATALOG_PAYLOAD_COUNT=$(printf '%s\n' "$CATALOG_PAYLOAD_FILES" | wc -l)
        test "$CATALOG_PAYLOAD_COUNT" -eq 1
        cmp -s "$CATALOG_PAYLOAD_FILES" "$GITHUB_WORKSPACE/src/cpp/resources/residency_profiles.json"

        sudo installer -pkg "$PKG_FILE" -target /
        echo "Installation complete"

        # Binaries are installed at /usr/local/bin
        BIN_PATH="/usr/local/bin"
        echo "$BIN_PATH" >> $GITHUB_PATH
        echo "bin-path=$BIN_PATH" >> $GITHUB_OUTPUT

        echo "Binaries at: $BIN_PATH"

    - name: Verify installation
      shell: bash
      run: |
        set -euo pipefail

        BIN_PATH="${{ steps.install.outputs.bin-path }}"
        echo "Verifying installation at: $BIN_PATH"

        test -f "/Library/Application Support/Lemonade/resources/residency_profiles.json"
        CATALOG_FILES=$(find "/Library/Application Support/Lemonade" -type f -name 'residency_profiles.json')
        CATALOG_FILE_COUNT=$(printf '%s\n' "$CATALOG_FILES" | wc -l)
        test "$CATALOG_FILE_COUNT" -eq 1
        test "$CATALOG_FILES" = "/Library/Application Support/Lemonade/resources/residency_profiles.json"
        cmp -s "$CATALOG_FILES" "$GITHUB_WORKSPACE/src/cpp/resources/residency_profiles.json"

        if [ -x "$BIN_PATH/lemond" ]; then
            echo "Found: lemond"
            "$BIN_PATH/lemond" --version
        else
            echo "ERROR: lemond not found at $BIN_PATH"
            exit 1
        fi

        if [ -x "$BIN_PATH/lemonade" ]; then
            echo "Found: lemonade"
            "$BIN_PATH/lemonade" --version
        else
            echo "WARNING: lemonade not found at $BIN_PATH"
        fi

        echo "Installation verification complete!"

    - name: Wait for server to be ready
      shell: bash
      run: |
        BIN_PATH="${{ steps.install.outputs.bin-path }}"
        LOG_FILE="$RUNNER_TEMP/lemond.log"

        # The .pkg postflight script starts the server via launchd.
        # Give it a few seconds to come up before checking.
        echo "Waiting for server to be ready..."
        for i in $(seq 1 15); do
          if curl -sf http://localhost:13305/live > /dev/null 2>&1; then
            echo "Server is running and healthy (started by launchd)"
            exit 0
          fi
          sleep 2
        done

        # Launchd may not work reliably in CI (no GUI session, restricted
        # sandbox). Fall back to starting the server manually.
        echo "Server not reachable after 30s — starting manually..."
        mkdir -p "$RUNNER_TEMP/xdg-runtime"
        chmod 700 "$RUNNER_TEMP/xdg-runtime"
        echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg-runtime" >> "$GITHUB_ENV"
        export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
        "$BIN_PATH/lemond" > "$LOG_FILE" 2>&1 &

        for i in $(seq 1 15); do
          if curl -sf http://localhost:13305/live > /dev/null 2>&1; then
            echo "Server is running and healthy (started manually)"
            exit 0
          fi
          echo "Waiting for server... ($i/15)"
          sleep 2
        done
        echo "ERROR: Server did not start within 60 seconds"
        cat "$LOG_FILE" 2>/dev/null || true
        exit 1
